[package]
  cjc-version = "0.0.1"
  name = "multi_language_interop"
  description = "Integration tests for Cangjie Extern with Python and JavaScript"
  version = "0.1.0"
  target-dir = ""
  output-type = "executable"
  compile-option = "--set-runtime-rpath"
  override-compile-option = ""
  link-option = "-L build/deps/cangjie_interop_python/build/native -lpython_bridge ${PYTHON_LDFLAGS} -L build/deps/cangjie_interop_javascript/build/native -lquickjs_bridge"
  package-configuration = {}

[dependencies]
  interop_python = { git = "https://github.com/belolourenco/cangjie_interop_python.git", commitId = "ade10f0c6e7593426d891dbc86cbb6d3add519b6" }
  interop_javascript = { git = "https://github.com/belolourenco/cangjie_interop_javascript.git", commitId = "0129de1f5be66c97c4b0d11ece3a5b39238af5ec" }
